[package]
name = "git-pulse"
version = "1.0.0"
description = "GitPulse - GitHub Stats & Velocity Dashboard"
authors = ["Kim Schulz <kim@schulz.dk>"]
license = "MIT"
repository = "https://github.com/kimusan/GitPulse"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "GitPulse"
path = "src/main.rs"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
